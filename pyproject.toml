[project]
name = "protobean"
version = "0.1.0"
description = "Generated Python bindings for Beancount protobuf schemas."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=6.33.5",
]

[project.urls]
Repository = "https://github.com/otaj/protobean"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.hatch.build]
artifacts = [
    "src/protobean/beancount",
]

[tool.hatch.build.targets.wheel]
packages = ["src/protobean"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/protobean",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py312"
src = ["src"]
respect-gitignore = false
extend-exclude = [".venv", "dist", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/protobean/beancount/*_pb2.py" = ["E402", "E501", "F401", "I001", "UP009"]
"src/protobean/beancount/*_pb2.pyi" = ["E501", "I001", "UP"]

[tool.ruff.format]
exclude = ["*_pb2.py", "*_pb2.pyi"]
