default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/bufbuild/buf
    rev: v1.72.0
    hooks:
      - id: buf-format
      - id: buf-lint
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]
