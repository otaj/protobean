name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install conventional-pre-commit==4.4.0
          while IFS= read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            conventional-pre-commit --verbose /tmp/commit-msg
          done < <(git rev-list --reverse "${{ github.event.pull_request.base.sha }}..HEAD")

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Generate Dart package
        run: ./tool/generate.sh
      - name: Analyze package
        run: |
          dart pub get
          dart analyze --fatal-infos
