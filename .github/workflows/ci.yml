name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
      - name: Lint protobuf
        run: |
          buf format --diff --exit-code
          buf lint
      - uses: actions/setup-python@v6
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.13"
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install conventional-pre-commit==4.4.0
          while IFS= read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            conventional-pre-commit --verbose /tmp/commit-msg
          done < <(git rev-list --reverse "${{ github.event.pull_request.base.sha }}..HEAD")

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Generate Dart package
        run: ./tool/generate_dart.sh
      - name: Analyze package
        run: |
          dart pub get
          dart analyze --fatal-infos

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Generate Python package
        run: ./tool/generate_python.sh
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check
      - name: Install and import
        run: |
          uv sync --group dev
          uv run python -c "from protobean import ledger_pb2"

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require changelog line
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./tool/check-changelog.sh
