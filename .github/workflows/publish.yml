# Publish Dart to pub.dev and Python to PyPI on version tags.
# pub.dev tag pattern: v{{version}}
# PyPI trusted publisher workflow filename: publish.yml
# https://dart.dev/tools/pub/automated-publishing
# https://docs.pypi.org/trusted-publishers/
name: Publish packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish-dart:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
      - uses: dart-lang/setup-dart@v1
      - name: Check tag matches package versions
        run: TAG_VERSION="${GITHUB_REF_NAME#v}" ./tool/check-package-versions.sh
      - name: Generate Dart package
        run: ./tool/generate_dart.sh
      - name: Install dependencies
        run: dart pub get
      - name: Publish - dry run
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish --force

  publish-python:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.72.0"
          setup_only: true
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Check tag matches package versions
        run: TAG_VERSION="${GITHUB_REF_NAME#v}" ./tool/check-package-versions.sh
      - name: Generate Python package
        run: ./tool/generate_python.sh
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
